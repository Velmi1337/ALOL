name: Fedora RPM

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      source_ref:
        description: Exact source commit (defaults to release tag)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fedora-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          persist-credentials: false
      - name: Download and build the exact released source in Fedora
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "alol-$version.tar.gz" --output "$RUNNER_TEMP/alol-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/fedora-out"
          chmod 777 "$RUNNER_TEMP/fedora-out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/alol-source.tar.gz:/release-source.tar.gz:ro" \
            -v "$RUNNER_TEMP/fedora-out:/out" \
            registry.fedoraproject.org/fedora:44 \
            bash /source/packaging/fedora/build-container.sh
      - name: Verify and publish the Fedora package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-fedora-download.py "$RUNNER_TEMP/fedora-out" --archive "$RUNNER_TEMP/alol-source.tar.gz"
          [[ $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP"/fedora-out/alol-*.x86_64.rpm \
            "$RUNNER_TEMP/fedora-out/alol.spec" "$RUNNER_TEMP/fedora-out/SHA256SUMS.fedora"
