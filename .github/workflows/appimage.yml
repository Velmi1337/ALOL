name: AppImage
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      source_ref:
        description: Exact source commit (defaults to release tag)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: appimage-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.tag }}
          persist-credentials: false
      - name: Build and test on Ubuntu 22.04
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "alol-$version.tar.gz" --output "$RUNNER_TEMP/alol-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/appimage-out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP/alol-source.tar.gz:/release-source.tar.gz:ro" \
            -v "$RUNNER_TEMP/appimage-out:/out" ubuntu:22.04 \
            bash /source/packaging/appimage/build-container.sh
      - name: Verify and upload portable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-appimage.py "$RUNNER_TEMP/appimage-out"
          [[ $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP"/appimage-out/*.AppImage \
            "$RUNNER_TEMP"/appimage-out/*-appimage-sources.tar.gz \
            "$RUNNER_TEMP/appimage-out/SHA256SUMS.appimage"
